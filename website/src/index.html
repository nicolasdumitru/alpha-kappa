<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductivity Graph</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div>
        <label for="solutionSelector">Selectați soluția:</label>
        <select id="solutionSelector">
            <option value="" disabled selected>Alegeți o soluție</option>
            <option value="HCl">HCl</option>
            <option value="KCl">KCl</option>
            <option value="NaOH">NaOH</option>
            <option value="CH₃COOH">CH₃COOH</option>
        </select>
    </div>

    <div id="inputContainer">
        <!-- Input fields will be dynamically added here -->
    </div>

    <div>
        <button id="generateGraphButton" hidden>Generați graficul</button>
    </div>

    <div>
        <button id="toggleModeButton" hidden>Schimbă la temperaturi</button>
    </div>

    <div id="chartContainer" style="margin-top: 20px;">
        <!-- The graph will be dynamically added here -->
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
